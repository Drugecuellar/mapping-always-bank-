<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap - Always.Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e1a;
            --surface: #111827;
            --surface2: #1a2236;
            --border: #1e2d45;
            --accent: #2563eb;
            --accent2: #3b82f6;
            --accent-glow: rgba(37, 99, 235, 0.18);
            --green: #10b981;
            --amber: #f59e0b;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --tag-bg: rgba(37, 99, 235, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #0a0e1a 0%, #0d1b3e 50%, #0a0e1a 100%);
            border-bottom: 1px solid var(--border);
            padding: 56px 24px 48px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(37, 99, 235, 0.22) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--tag-bg);
            border: 1px solid rgba(37, 99, 235, 0.4);
            border-radius: 999px;
            padding: 4px 14px;
            font-size: 12px;
            color: var(--accent2);
            font-weight: 600;
            letter-spacing: .04em;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .hero p {
            color: var(--muted);
            font-size: 1rem;
            max-width: 540px;
            margin: 0 auto 28px;
        }

        .hero-url {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            color: var(--accent2);
            font-weight: 500;
            text-decoration: none;
            transition: all .2s;
        }

        .hero-url:hover {
            border-color: var(--accent2);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Stats Bar */
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 20px 24px;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
        }

        .stat-label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        /* Section Headings */
        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .section-title .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* Tree Sections */
        .tree {
            margin-bottom: 56px;
        }

        .tree-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: all .2s;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.15);
        }

        .card-header {
            padding: 16px 18px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .95rem;
            flex-shrink: 0;
        }

        .card-title {
            font-weight: 700;
            font-size: .95rem;
            color: #fff;
        }

        .card-url {
            font-size: 11px;
            color: var(--muted);
            font-family: monospace;
        }

        .card-body {
            padding: 14px 18px;
        }

        /* Item Lists */
        .item-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .item-list li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: .83rem;
            color: var(--muted);
        }

        .item-list li::before {
            content: '›';
            color: var(--accent2);
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* CTA Tags */
        .cta-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .cta-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid;
            cursor: default;
        }

        .cta-primary { background: rgba(37, 99, 235, .15); border-color: rgba(37, 99, 235, .45); color: #93c5fd; }
        .cta-green { background: rgba(16, 185, 129, .12); border-color: rgba(16, 185, 129, .4); color: #6ee7b7; }
        .cta-amber { background: rgba(245, 158, 11, .12); border-color: rgba(245, 158, 11, .4); color: #fcd34d; }
        .cta-purple { background: rgba(139, 92, 246, .12); border-color: rgba(139, 92, 246, .4); color: #c4b5fd; }
        .cta-cyan { background: rgba(6, 182, 212, .12); border-color: rgba(6, 182, 212, .4); color: #a5f3fc; }

        /* Colors */
        .c-blue { background: rgba(37, 99, 235, .15); color: #2563eb; }
        .c-green { background: rgba(16, 185, 129, .12); color: #10b981; }
        .c-amber { background: rgba(245, 158, 11, .12); color: #f59e0b; }
        .c-purple { background: rgba(139, 92, 246, .12); color: #8b5cf6; }
        .c-cyan { background: rgba(6, 182, 212, .12); color: #06b6d4; }

        footer {
            text-align: center;
            padding: 48px 24px;
            color: var(--muted);
            font-size: 13px;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .stats { gap: 20px; }
            .tree-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-badge">🗺️ Sitemap</div>
        <h1>Always.Bank</h1>
        <p>Complete website mapping including internal pages, services, navigation, and CTA strategy.</p>
        <a class="hero-url" href="https://www.always.bank" target="_blank">🔗 www.always.bank</a>
    </header>

    <div class="stats">
        <div class="stat"><div class="stat-num">3</div><div class="stat-label">Main Menus</div></div>
        <div class="stat"><div class="stat-num">14</div><div class="stat-label">Total Pages</div></div>
        <div class="stat"><div class="stat-num">12</div><div class="stat-label">Unique CTAs</div></div>
        <div class="stat"><div class="stat-num">4</div><div class="stat-label">Social Platforms</div></div>
    </div>

    <div class="container">

        <div class="tree">
            <div class="section-title">
                <div class="icon c-blue" style="border:1px solid rgba(37,99,235,0.4);">🌐</div> 1. Navigation Menus
            </div>
            <div class="tree-grid">
                <div class="card" style="border-color: rgba(37,99,235,0.4);">
                    <div class="card-header"><div class="card-title">Main Navigation</div></div>
                    <div class="card-body">
                        <ul class="item-list">
                            <li>Loans (Dropdown)</li>
                            <li>Banking (Dropdown)</li>
                            <li>Learn (Dropdown)</li>
                        </ul>
                    </div>
                </div>
                <div class="card" style="border-color: rgba(37,99,235,0.4);">
